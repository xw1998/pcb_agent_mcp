[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-agent-mcp"
version = "0.0.128"
description = "AI-native PCB design MCP server - Calc layer: current, impedance, lambda/20 and safety spacing with a strict evidence envelope"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { file = "LICENSE" }
authors = [
    { name = "xw19981010", email = "1490588966@qq.com" },
]
keywords = ["mcp", "pcb", "eda", "kicad", "easyeda", "lcsc", "ipc-2221", "impedance", "creepage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://gitee.com/xw19981010/pcb_agent_mcp"
Repository = "https://gitee.com/xw19981010/pcb_agent_mcp"
Issues = "https://gitee.com/xw19981010/pcb_agent_mcp/issues"

[project.scripts]
pcb-agent-mcp = "pcb_agent_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
