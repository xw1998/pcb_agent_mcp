[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-agent-mcp"
version = "0.1.42"
description = "PCB design MCP server for AI agents: current, impedance, creepage, thermal and magnetics calculators plus gated KiCad / LCEDA-Pro editing, DRC and JLCPCB fabrication gates"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { file = "LICENSE" }
authors = [
    { name = "xw19981010", email = "1490588966@qq.com" },
]
keywords = ["mcp", "model-context-protocol", "ai-agent", "pcb", "eda", "kicad", "easyeda", "lceda", "lcsc", "jlcpcb", "drc", "ipc-2221", "impedance", "creepage", "thermal", "schematic", "gerber"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://gitee.com/xw19981010/pcb_agent_mcp"
Repository = "https://gitee.com/xw19981010/pcb_agent_mcp"
Issues = "https://gitee.com/xw19981010/pcb_agent_mcp/issues"

[project.scripts]
pcb-agent-mcp = "pcb_agent_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

# The JLCPCB capability library ships inside the package: every limit must travel
# with its src/quote/tier, so a wheel without these JSON files would be a wheel whose
# gates have no numbers to compare against.
[tool.setuptools.package-data]
"pcb_agent_mcp.jlc" = ["data/*.json", "data/rule-presets/*.json"]

# The rest of the tables - safety, IPC charts, the powder-core catalog, the rule
# ledger and the experience seed - live in the repository-root `data/` directory,
# outside the package, because `docs/` names them by that path and because a table
# you can open in an editor is a table you can check against the page it came from.
# A wheel installs them under <prefix>/share/pcb_agent_mcp/data/; pcb_agent_mcp.
# datafiles looks there as well as in a source checkout. Without this block a
# `pip install` would ship every tool with its table missing.
[tool.setuptools.data-files]
"share/pcb_agent_mcp/data" = ["data/*.json"]
